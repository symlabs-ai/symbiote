[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbiote"
version = "0.8.10"
description = "Kernel for persistent cognitive entities"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"

dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0,<25.0.0",
    "httpx>=0.27.0,<0.28.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
llm = [
    # ForgeLLM v0.7.18 — immutable release commit.
    "forge-llm @ git+https://github.com/symlabs-ai/forge_llm.git@b26b5e36e5d5be301e60cedeb13b4b434815a1f7",
]
extract = [
    # Sub-extras [article,transcript,sofascore] are necessary because
    # forge_scraper/__init__.py imports sofascore (curl_cffi) at module load.
    # article=trafilatura (generic markdown extraction), transcript=youtube.
    # ForgeScraper v0.12.4 — immutable release commit.
    "forge-scraper[article,transcript,sofascore] @ git+https://github.com/symlabs-ai/forge_scraper.git@632e4ce5d218bedebad3411df48625f4b34d7f29",
]
postgres = [
    "psycopg[binary,pool]>=3.2",
]
browser = [
    "playwright>=1.40.0",
]
stealth = [
    "playwright-stealth>=1.0.0",
]

[project.scripts]
symbiote = "symbiote.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"symbiote.api" = ["*.html"]
"symbiote.ui" = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require browser binaries or external integration services",
    "sqlite_only: tests of SQLite-specific behaviour, skipped when the suite runs on PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
# Gate in the Dockerfile quality stage. strict is the goal (BACKLOG B-71):
# it still reports the generic-parameter (type-arg) and untyped-def debt.
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional / untyped dependencies.
module = [
    "yaml", "forge_llm", "forge_llm.*", "forge_scraper",
    "playwright", "playwright.*", "psycopg", "psycopg.*",
    "psycopg_pool", "psycopg_pool.*", "tomli",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/symbiote"]

[tool.coverage.report]
fail_under = 85
